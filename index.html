<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج تجريبي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .demo-banner {
            background: #fff3cd;
            color: #805d00;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6d28d9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #5b21b6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="demo-banner">
        ⚠️ نموذج اختبار تجريبي
    </div>

    <!-- نموذج متوافق ومباشر للإرسال -->
    <form action="https://formsubmit.co/mohammedata009@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">

        <div class="form-group">
            <label for="phone">رقم الهاتف</label>
            <input type="tel" id="phone" name="phone" placeholder="أدخل رقم الهاتف" required>
        </div>

        <div class="form-group">
            <label for="notes">ملاحظات أو استفسار</label>
            <textarea id="notes" name="notes" rows="3" placeholder="أدخل نص الرسالة" required></textarea>
        </div>

        <button type="submit">إرسال التجربة</button>
    </form>
</div>

</body>
</html>
